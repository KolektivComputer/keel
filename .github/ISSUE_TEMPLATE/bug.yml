name: Bug report
description: Something is broken or wrong
type: Bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: checkboxes
    id: targets
    attributes:
      label: Targets
      description: Where this lands (triage applies matching `t/` labels).
      options:
        - label: ktor
        - label: svelte
        - label: react
        - label: vue
        - label: solid
        - label: preact
        - label: lit
        - label: angular
        - label: vanilla
        - label: compose
        - label: repo
        - label: cloudflare
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Keel and adapter versions (or commit).
      placeholder: e.g. keel 0.1.0 · @keel/svelte …
    validations:
      required: false
