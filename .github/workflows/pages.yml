# Deploy the Keel docs site to Cloudflare Pages.
#
# GitHub Pages (actions/upload-pages-artifact + actions/deploy-pages) was
# replaced by Cloudflare Pages. CI deploy runs wrangler via `pnpm dlx` (no
# dependency added, no lockfile change) and currently needs a valid
# CLOUDFLARE_API_TOKEN secret: the org token is IP-restricted and GitHub
# runners are rejected with Cloudflare error 9109 — to be fixed later.
#
# Local deploy:
#   pnpm dlx wrangler@4.131.1 pages deploy dist --project-name=keel-docs --branch=main
name: Deploy docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: DOCS_SITE=https://keel.mey.cat pnpm --filter @kolektiv/keel-docs build

      - name: Deploy to Cloudflare Pages
        env:
          # Production deploys use the default branch; PRs use the head branch.
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.131.1 pages deploy dist --project-name=keel-docs --branch="$BRANCH"
